[[entry]]
id = 5
type = "story"
title = "Use Playwright only when public HTTP evidence is insufficient"
description = "Add a bounded Chromium fallback for supported public pages and stop on login, CAPTCHA, or explicit block conditions rather than bypassing them."
verify = "A fixture needing rendering gains evidence within the configured budget, while blocked/login fixtures return their access status without bypass."
covers = ["R4"]
after = [2, 3, 4]
hitl = false
risk = "high"
unknown = "Fallback budget and completeness threshold need cost/coverage evidence before pilot tuning."

[[entry]]
id = 6
type = "story"
title = "Accept and merge extension evidence safely"
description = "Define the extension page-state payload and separate merge module, combining permitted rendered supplier/review evidence with server and historical evidence using stable deduplication and provenance without editing platform adapters."
verify = "An extension fixture enriches a snapshot without duplicate evidence or any platform cookie, password, or session token in the accepted payload."
covers = ["R4"]
after = [1, 2]
hitl = false
risk = "high"
unknown = "Permitted fields and source-platform terms must be reviewed before production collection."

[[entry]]
id = 7
type = "story"
title = "Exercise extraction layouts and re-normalization"
description = "Add representative layout, missing-field, high-review-volume, redirect, parser-change, and timeout cases, and support re-normalizing preserved raw snapshots."
verify = "The fixture matrix reports correct statuses and coverage, and a parser revision re-normalizes an old raw snapshot without crawling again."
covers = ["R4"]
after = [3, 4, 5, 6]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Refactor sweep"
description = "Clean up shared extraction and adapter code identified by build records while preserving the platform-specific contract and failure behavior."
verify = "The deployed three-platform extraction matrix and extension merge checks still pass after cleanup."
covers = ["R4"]
after = [2, 3, 4, 5, 6, 7]
hitl = false
risk = "low"
