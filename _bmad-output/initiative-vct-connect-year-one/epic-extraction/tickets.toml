[[entry]]
id = 1
type = "story"
title = "Extract a 1688 URL into the shared SupplierData contract"
description = "Freeze the shared SupplierData contract, validate a 1688 URL, use httpx/selectolax, and persist raw/normalized snapshots plus accessible reviews through the queued analysis path."
verify = "A representative 1688 URL yields a pollable snapshot with source URL, method, mode, version, completeness, missing fields, and timestamp."
covers = ["R4"]
after = ["1.3", "1.4"]
hitl = false
risk = "high"
unknown = "Representative 1688 pages and field-level optionality must be agreed from observed pages."

[[entry]]
id = 2
type = "story"
title = "Classify extraction failures and bounded HTTP retries"
description = "Freeze the shared extraction status contract and map invalid, redirected, inaccessible, changed, timed-out, and partial pages to it while guiding auth-required or blocked users toward the extension."
verify = "Fixture cases return SUCCESS, PARTIAL, AUTH_REQUIRED, BLOCKED, UNSUPPORTED_PAGE, TIMEOUT, or PARSE_FAILED as appropriate."
covers = ["R4"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Add the Taobao source adapter"
description = "Implement Taobao supplier/product URL normalization and HTTP extraction against the established SupplierData and status contracts."
verify = "Representative Taobao URLs produce versioned snapshots or the correct explicit access/failure status."
covers = ["R4"]
after = [1, 2]
hitl = false
risk = "high"
unknown = "Public Taobao field accessibility varies by page and region and must be measured."

[[entry]]
id = 4
type = "story"
title = "Add the Alibaba source adapter"
description = "Implement Alibaba supplier/product URL normalization and HTTP extraction against the established SupplierData and status contracts."
verify = "Representative Alibaba URLs produce versioned snapshots or the correct explicit access/failure status."
covers = ["R4"]
after = [1, 2]
hitl = false
