name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run typecheck --prefix frontend
      - name: Build web and scan client artifacts and build log
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          npm run build --prefix frontend > web-build.log 2>&1 || { echo 'Web build failed; raw build log withheld.'; exit 1; }
          python scripts/scan_frontend_secrets.py --build-log web-build.log
      - name: Build deployable images
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          docker build --file backend/Dockerfile --tag vct-backend:ci .
          docker build --file frontend/apps/web/Dockerfile --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY --tag vct-web:ci .
      - name: Compile Azure templates
        run: |
          az bicep build --file infra/azure/bootstrap.bicep --stdout > /dev/null
          az bicep build --file infra/azure/main.bicep --stdout > /dev/null
